<!doctype html>
<html lang="ru">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#102b53">
  <title>Карта уровней · Game Kids</title>
  <link rel="stylesheet" href="design/tokens.css">
  <link rel="stylesheet" href="levels.css?v=clean-focus-12">
  <script async src="https://telegram.org/js/telegram-web-app.js" onload="window.dispatchEvent(new Event('telegram-ready'))"></script>
  <script type="module" src="levels.js?v=clean-focus-12"></script>
</head>
<body class="map-pending">
  <section id="map-loading" class="map-loading" role="status"><p id="map-loading-text">Загружаем зимнюю карту…</p><button id="retry-map" type="button" hidden>Повторить загрузку</button></section>
  <main class="map-viewport" aria-label="Выбор уровня" aria-describedby="map-help">
    <div class="map-space">
      <div class="level-map">
        <div class="map-background"><img src="assets/levels/map.webp" alt="" width="666" height="1000" fetchpriority="high"></div>
        <div class="map-bottom" aria-hidden="true"><img src="assets/levels/map-bottom.webp" alt=""></div>
        <img class="snowman" src="assets/levels/snowman.webp" alt="" width="69" height="89">
        <div id="level-points" role="group" aria-label="12 уровней"></div>
        <img id="character" src="assets/levels/character.webp" alt="" width="146" height="134">
      </div>
    </div>
  </main>
  <div class="map-snow" aria-hidden="true"><i style="--i:0"></i><i style="--i:1"></i><i style="--i:2"></i><i style="--i:3"></i><i style="--i:4"></i><i style="--i:5"></i><i style="--i:6"></i><i style="--i:7"></i><i style="--i:8"></i><i style="--i:9"></i><i style="--i:10"></i><i style="--i:11"></i><i style="--i:12"></i><i style="--i:13"></i><i style="--i:14"></i><i style="--i:15"></i><i style="--i:16"></i><i style="--i:17"></i><i style="--i:18"></i><i style="--i:19"></i><i style="--i:20"></i><i style="--i:21"></i><i style="--i:22"></i><i style="--i:23"></i><i style="--i:24"></i><i style="--i:25"></i><i style="--i:26"></i><i style="--i:27"></i><i style="--i:28"></i><i style="--i:29"></i><i style="--i:30"></i><i style="--i:31"></i><i style="--i:32"></i><i style="--i:33"></i><i style="--i:34"></i><i style="--i:35"></i><i style="--i:36"></i><i style="--i:37"></i><i style="--i:38"></i><i style="--i:39"></i><i style="--i:40"></i><i style="--i:41"></i><i style="--i:42"></i><i style="--i:43"></i><i style="--i:44"></i><i style="--i:45"></i><i style="--i:46"></i><i style="--i:47"></i></div>
  <footer id="map-actions" class="map-actions" aria-label="Запуск текущего уровня"><button id="play-current" type="button" disabled><img src="assets/levels/play-button.webp" alt=""><span>Играть</span></button></footer>
  <iframe id="level-game" data-src="index.html?from=map&amp;v=results-local-1" title="Игра выбранного уровня" allow="autoplay" hidden></iframe>
  <div id="game-loading" hidden role="status">Готовим игру… <button id="cancel-loading" type="button">На карту</button></div>
  <p id="map-help" class="sr-only">Прокручивайте карту. Пройдите текущий уровень, чтобы открыть следующий. Голубые уровни заблокированы. Заработайте звёзды и вернитесь на карту, чтобы перейти к следующему уровню.</p>
  <p id="level-status" class="sr-only" role="status" aria-live="polite"></p>
</body>
</html>

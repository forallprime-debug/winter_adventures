<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#102b53">
  <title>Карта уровней · Game Kids</title>
  <link rel="stylesheet" href="design/tokens.css">
  <link rel="stylesheet" href="levels.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script type="module" src="levels.js"></script>
</head>
<body>
  <main class="map-viewport" aria-label="Выбор уровня" aria-describedby="map-help">
    <div class="map-space">
      <div class="level-map">
        <div class="map-background"><img src="assets/levels/map.png" alt="" width="666" height="1000" fetchpriority="high"></div>
        <img class="snowman" src="assets/levels/snowman.png" alt="" width="69" height="89">
        <div id="level-points" role="group" aria-label="12 уровней"></div>
        <img id="character" src="assets/levels/character.png" alt="" width="146" height="134">
      </div>
    </div>
  </main>
  <iframe id="level-game" src="index.html?from=map&amp;v=note-press-2" title="Игра выбранного уровня" allow="autoplay" hidden></iframe>
  <div id="game-loading" hidden role="status">Готовим игру… <button id="cancel-loading" type="button">На карту</button></div>
  <p id="map-help" class="sr-only">Прокручивайте карту. Нажмите на точку, чтобы начать игру. Заработайте звёзды и вернитесь на карту, чтобы перейти к следующему уровню.</p>
  <p id="level-status" class="sr-only" role="status" aria-live="polite"></p>
</body>
</html>
